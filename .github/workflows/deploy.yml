name: Deploy to Cloud Run Jobs

on:
  push:
    branches: [gcp]

env:
  PROJECT_ID: personal-assistant-454804
  REGION: europe-west1
  REPO: mishna
  IMAGE: mishnaimage
  JOB_NAME: my-job

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}

          # Function to retry commands with exponential backoff
          retry() {
            local max_attempts=3
            local initial_delay=5
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts..."
              if "$@"; then
                return 0
              else
                echo "Command failed on attempt $attempt"
                if [ $attempt -eq $max_attempts ]; then
                  echo "All attempts failed"
                  return 1
                fi
                local delay=$((initial_delay * (2 ** (attempt - 1))))
                echo "Retrying in $delay seconds..."
                sleep $delay
                ((attempt++))
              fi
            done
          }

          # Build Docker image with retry
          retry docker build -t $IMAGE_URI:${{ github.sha }} -t $IMAGE_URI:latest .

          # Push sha-tagged image with retry
          retry docker push $IMAGE_URI:${{ github.sha }}

          # Push latest-tagged image with retry
          retry docker push $IMAGE_URI:latest
